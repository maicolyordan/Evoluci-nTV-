  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Aleatorio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita scrollbars */
            background-color: black;
        }

        video {
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        var videos = [
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/Alerta%20Roja_%20Terremoto%208.5%20-%20Trailer%20Doblado(360P).mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/ACCION/ashfall_alerta_roja.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/Alien_%20Romulus%20_%20Tr%C3%A1iler%20Oficial%20en%20espa%C3%B1ol%20_%20HD(720P_HD).mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/ACCION/alien_romulus.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/Un%20Espia%20Y%20Medio__%20Pelea%20En%20El%20Bar%20pt.2(360P).mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/COMEDIA/un_espia_y_medio.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/Winners%20and%20Sinners_Vencedores%20y%20vencidos%20(1983)%20HD%20Espa%C3%B1ol%20-%20MG_MF(360P).mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/MARCIALES/vencedores_y_vencidos_1983.html" }
        ];

        var selectedVideo;

        function playRandomVideo() {
            var randomIndex = Math.floor(Math.random() * videos.length);
            selectedVideo = videos[randomIndex];

            var video = document.getElementById('liveVideo');
            video.src = selectedVideo.url;
            video.play();
        }

        document.addEventListener("fullscreenchange", function() {
            if (document.fullscreenElement) {
                window.location.href = selectedVideo.page;
            }
        });

        window.onload = function() {
            playRandomVideo();
        };
    </script>
</head>
<body>

    <video id="liveVideo" controls autoplay muted>
        Tu navegador no soporta el reproductor de video.
    </video>

</body>
</html>
