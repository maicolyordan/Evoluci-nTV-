 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor de Video Aleatorio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita scrollbars */
            background-color: black;
        }

        video {
            width: 100%;
            height: 100%;
        }
    </style>
    <script>
        var videos = [
            { url: "https://1a-1791.com/video/fwe2/ed/s8/2/O/v/m/p/Ovmpy.oaa.mp4", page: "pagina1.html" },
            { url: "https://1a-1791.com/video/fwe2/ed/s8/2/O/v/m/p/Ovmpy.oaa.mp4", page: "pagina2.html" },
            { url: "https://1a-1791.com/video/fwe2/ed/s8/2/O/v/m/p/Ovmpy.oaa.mp4", page: "pagina3.html" }
        ];

        var selectedVideo;

        function playRandomVideo() {
            var randomIndex = Math.floor(Math.random() * videos.length);
            selectedVideo = videos[randomIndex];

            var video = document.getElementById('liveVideo');
            video.src = selectedVideo.url;
            video.play();
        }

        document.addEventListener("fullscreenchange", function() {
            if (document.fullscreenElement) {
                window.location.href = selectedVideo.page;
            }
        });

        window.onload = function() {
            playRandomVideo();
        };
    </script>
</head>
<body>

    <video id="liveVideo" controls autoplay muted>
        Tu navegador no soporta el reproductor de video.
    </video>

</body>
</html>
