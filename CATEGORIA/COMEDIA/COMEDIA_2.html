        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0d0b25;
            color: white;
        }


        .section-title {
            font-size: 18px;
            font-weight: bold;
            border-left: 3px solid red;
            padding-left: 5px;
        }

        

    .image-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 90%;
    }

    .image-container img {
      width: 100%;
      height: auto;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

.image-container img {
  width: 100%;
  height: auto;
  cursor: pointer;
  transition: transform 0.3s ease, border 0.3s ease;
  border: 5px solid transparent; /* Bordes invisibles por defecto */
}



    @media screen and (orientation: landscape) {
      .image-container {
        grid-template-columns: repeat(4, 1fr);
      }
    }
    
        /* Ajustamos la sección de la cabecera para que esté más arriba */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px; /* Reducir aún más el espacio entre la cabecera y la búsqueda */
        }

        /* Estilos para el botón de casa */
        .home-button {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        .home-button svg {
            fill: white;
            width: 40px;
            height: 40px;
        }

        /* Estilos para el título */
        .titulo {
            font-size: 24px;
            margin-left: 10px;
            color: white;
        }
    
button {
            background-color: #f44336; /* Rojo */
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        
    
/* Asegurar que todos los elementos puedan ser enfocados */
* {
  outline: none; /* Elimina el borde por defecto del navegador */
}

/* Estilo general para resaltar el enfoque */
button:focus, a:focus, div:focus, input:focus, textarea:focus, img:focus {
  outline: 3px solid red; /* Borde brillante de color rojo para resaltar el enfoque */
  background-color: #555; /* Fondo ligeramente cambiado cuando está enfocado */
  transform: scale(1.05); /* Agranda el elemento ligeramente */
  transition: background-color 0.3s, transform 0.3s; /* Transiciones suaves */
}

/* Para enlaces o elementos interactivos que se ven bien sin que el fondo cambie */
a:focus {
  color: red; /* Cambia el color del texto del enlace cuando está enfocado */
}

/* Opcional: para imágenes o elementos que quieras resaltar sin cambiar su color de fondo */
img:focus {
  border: 3px solid red; /* Agrega un borde resaltado de color rojo a las imágenes */
  transform: scale(1.1); /* Agranda la imagen ligeramente */
}

/* Si el elemento no tiene un fondo visible, puedes aplicar un enfoque solo con el borde */
div:focus {
  border: 2px dashed red; /* Aplica un borde de puntos rojos en los divs */
}
  </style>
