    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 2px;
            margin: 0;
        }

        /* Ajustamos la sección de la cabecera para que esté más arriba */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 5px; /* Reducir aún más el espacio entre la cabecera y la búsqueda */
        }

        /* Estilos para el botón de casa */
        .home-button {
            background-color: transparent;
            border: none;
            cursor: pointer;
        }

        .home-button svg {
            fill: white;
            width: 40px;
            height: 40px;
        }

        /* Estilos para el título */
        .titulo {
            font-size: 24px;
            margin-left: 10px;
            color: white;
        }

        /* Ajustar la apariencia del campo de búsqueda */
        #busqueda {
            padding: 8px; /* Reducir el padding */
            width: 60%;
            margin: 5px 0; /* Reducir el margen entre los elementos */
            font-size: 16px;
            border: 2px solid #f71818;
            border-radius: 5px;
            background-color: #ffffff;
            color: #000000;
        }

        /* Estilo del botón de búsqueda */
        button {
            padding: 8px 20px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Eliminar el hover */
        /* button:hover {
            background-color: darkred;
        } */

.image-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 columnas por defecto */
    gap: 15px;
    margin: 20px 0;
}

.image-container {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    transition: transform 0.3s, box-shadow 0.3s;
    padding-bottom: 150%; /* Mantiene la proporción vertical (9:16) */
    background-color: #333; /* Color de fondo para contenedores vacíos */
}

.image-container img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
}

.image-container:hover {
    transform: scale(1.1); /* Agranda el contenedor de la imagen al 110% al hacer hover */
}
        
        

        .no-resultados {
            color: #f1f1f1;
            font-size: 18px;
            margin-top: 20px;
        }

        /* Media query para dispositivos en modo horizontal */
        @media (orientation: landscape) {
            .image-section {
                grid-template-columns: repeat(4, 1fr); /* 4 columnas en modo horizontal */
            }
        }
        
        
/* Asegurar que todos los elementos puedan ser enfocados */
* {
  outline: none; /* Elimina el borde por defecto del navegador */
}

/* Estilo general para resaltar el enfoque */
button:focus, a:focus, div:focus, input:focus, textarea:focus, img:focus {
  outline: 3px solid red; /* Borde brillante de color rojo para resaltar el enfoque */
  background-color: #555; /* Fondo ligeramente cambiado cuando está enfocado */
  transform: scale(1.05); /* Agranda el elemento ligeramente */
  transition: background-color 0.3s, transform 0.3s; /* Transiciones suaves */
}

/* Para enlaces o elementos interactivos que se ven bien sin que el fondo cambie */
a:focus {
  color: red; /* Cambia el color del texto del enlace cuando está enfocado */
}

/* Opcional: para imágenes o elementos que quieras resaltar sin cambiar su color de fondo */
img:focus {
  border: 3px solid red; /* Agrega un borde resaltado de color rojo a las imágenes */
  transform: scale(1.1); /* Agranda la imagen ligeramente */
}

/* Si el elemento no tiene un fondo visible, puedes aplicar un enfoque solo con el borde */
div:focus {
  border: 2px dashed red; /* Aplica un borde de puntos rojos en los divs */
}
    </style>

        document.getElementById('busqueda').addEventListener('input', buscar);

        function calcularCoincidencias(textoPelicula, palabrasBusqueda) {
            let coincidencias = 0;
            palabrasBusqueda.forEach(palabra => {
                for (let i = 0; i <= palabra.length - 3; i++) {
                    const subcadena = palabra.substring(i, i + 3);
                    if (textoPelicula.includes(subcadena)) {
                        coincidencias++;
                    }
                }
            });
            return coincidencias;
        }

        function buscar() {
            const busqueda = document.getElementById('busqueda').value.toLowerCase();
            const resultadosDiv = document.getElementById('resultados');
            resultadosDiv.innerHTML = ''; // Limpiar resultados previos

            if (busqueda.length === 0) {
                return; // Si el campo de búsqueda está vacío, no hacemos nada
            }

            const palabrasBusqueda = busqueda.split(' ');

            const resultados = peliculas.map(pelicula => ({
                ...pelicula,
                coincidencias: calcularCoincidencias(pelicula.texto.toLowerCase(), palabrasBusqueda)
            }))
            .filter(pelicula => pelicula.coincidencias > 0)
            .sort((a, b) => b.coincidencias - a.coincidencias);

            if (resultados.length === 0) {
                resultadosDiv.innerHTML = '<p class="no-resultados">No se encontraron resultados.</p>';
                return;
            }

            resultados.forEach(pelicula => {
                const divResultado = document.createElement('div');
                divResultado.classList.add('image-container');

                const imagen = document.createElement('img');
                imagen.src = pelicula.imagen;
                imagen.alt = pelicula.texto;
                imagen.onclick = function() {
                    window.location.href = pelicula.enlace;
                };

                divResultado.appendChild(imagen);
                resultadosDiv.appendChild(divResultado);
            });
        }
    </script>
