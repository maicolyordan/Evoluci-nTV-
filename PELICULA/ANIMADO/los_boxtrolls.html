 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Los Boxtrolls</title>
  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
<body>
  <!-- Título -->
  <h1> Los Boxtrolls</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/8880939600507')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://vidhidefast.com/v/pjyxi33es3p1 ')">opcion 2</button>
    <button class="button" onclick="loadIframe('https://goovbdstream.one/embed-cr5esjoq1k5v.html')">opcion 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <iframe id="secureFrame" src="https://ok.ru/videoembed/8880939600507" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>
<button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/8880939600507", 
      "https://vidhidefast.com/v/pjyxi33es3p1 ", 
      "https://goodstream.one/embed-cr5esjoq1k5v.html"
    ];
    
    const iframe = document.getElementById('secureFrame');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Asegurar que la URL predeterminada se carga al inicio
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/8880939600507"; // URL predeterminada
    });

    // Bloquear intentos de navegación no deseados
    document.addEventListener('contextmenu', (e) => e.preventDefault()); // Bloquear clic derecho
    document.addEventListener('keydown', (e) => {
      // Bloquear teclas específicas como F12, Ctrl+U, Ctrl+Shift+I
      if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "U" || e.key === "I"))) {
        e.preventDefault();
      }
    });

    // Bloquear ventanas emergentes y redirecciones
    const originalWindowOpen = window.open;
    window.open = function (url) {
      return null; // Bloquear la ventana emergente
    };

    // Monitorear cambios en el DOM para bloquear URLs no permitidas
    const observer = new MutationObserver(() => {
      const iframeSrc = iframe.src;
      if (!allowedURLs.includes(iframeSrc)) {
        iframe.src = "about:blank";
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Bloquear URLs peligrosas (data:text)
    if (window.location.href.startsWith("data:text")) {
      document.body.innerHTML = `<h1 style='color: red;'>Acceso bloqueado</h1>`;
    }

                function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}              
  </script>
<p>
  Los Boxtrolls es una película animada de los creadores de ParaNorman y Coraline y la puerta secreta, basada en la novela Here Be a Monsters! de Alan Snow, producida por Laika Entertainment y distribuida por Focus Features International a traves de Universal Studios.
  </p>


</body>
</html>
