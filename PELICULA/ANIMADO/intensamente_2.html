 <head>

  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
 <body> 
  <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';"> VOLVER AL INICIO </button> 
  <div style="height: 50px;"></div> 
  <!-- Título --> 
  <h1>Intensamente 2</h1> 
  
  <!-- Contenedor de botones --> 
  <div class="buttons-container"> 
   <button class="button" onclick="loadIframe('https://hugh.cdn.rumble.cloud/video/s8/2/e/3/b/p/e3bps.aaa.mp4')">Opción 1</button> 
   <button class="button" onclick="loadIframe('https://archive.org/embed/intensa-mente-2_202406/IntensaMente%202.mp4')">Opción 2</button> 
   <button class="button" onclick="loadIframe('https://vidhidefast.com/v/2ajluf6gbjfc ')">Opción 3</button> 
  </div> 
  <!-- Contenedor del iframe --> 
  <div class="iframe-container"> 
   <div class="overlay" onclick="hideOverlay()"></div> 
   <iframe id="secureFrame" src="https://hugh.cdn.rumble.cloud/video/s8/2/e/3/b/p/e3bps.aaa.mp4" allowfullscreen sandbox="allow-same-origin allow-scripts" allow="fullscreen; autoplay; encrypted-media"> </iframe> 
  </div> 
  
<button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>
  <!-- Texto adicional debajo del iframe --> 
  <p> Las vocecillas dentro de la cabeza de Riley la conocen del derecho y del revés, pero el próximo verano todo cambiará cuando Del revés 2 de Disney y Pixar introduzca una nueva emoción: ansiedad.

</p> 
  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://hugh.cdn.rumble.cloud/video/s8/2/e/3/b/p/e3bps.aaa.mp4", 
      "https://archive.org/embed/intensa-mente-2_202406/IntensaMente%202.mp4", 
      "https://vidhidefast.com/v/2ajluf6gbjfc "
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://hugh.cdn.rumble.cloud/video/s8/2/e/3/b/p/e3bps.aaa.mp4";
    });
    
    function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script> 
 </body>
</html>
