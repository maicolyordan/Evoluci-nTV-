 <html lang="es">
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Dos pavos en apuros</title> 
  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
 <body> 
  <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';"> VOLVER AL INICIO </button> 
  <div style="height: 50px;"></div> 
  <!-- Título --> 
  <h1>Dos pavos en apuros
</h1> 
  <!-- Contenedor de botones --> 
  <div class="buttons-container"> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/4322448378609')">Opción 1</button> 
   <button class="button" onclick="loadIframe('https://archive.org/embed/alvasaa_20181031_1957')">Opción 2</button> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/7083415767725')">Opción 3</button> 
  </div> 
  <!-- Contenedor del iframe --> 
  <div class="iframe-container"> 
   <div class="overlay" onclick="hideOverlay()"></div> 
   <iframe id="secureFrame" src="https://ok.ru/videoembed/4322448378609" allowfullscreen sandbox="allow-same-origin allow-scripts" allow="fullscreen; autoplay; encrypted-media"> </iframe> 
  </div> 
<button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>
  
  <!-- Texto adicional debajo del iframe --> 
  <p> Un par de pavos descubren una máquina del tiempo y deciden utilizarla para volver atrás en el tiempo al primer Día de Acción de Gracias para impedir convertirse en parte del menú.</p> 
  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/4322448378609", 
      "https://archive.org/embed/alvasaa_20181031_1957", 
      "https://ok.ru/videoembed/7083415767725"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/4322448378609";
    });

   function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script> 
 </body>
</html>
