 <html lang="es">
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Relatos Animados de la Biblia</title> 
  <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Arial', sans-serif;
    background-color: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

h1 {
    margin-top: 50px;
    margin-bottom: 20px;
    font-size: 26px;
    text-align: center;
    color: white;
}

.container {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.1);
    max-width: 500px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: all 0.3s ease-in-out;
}

/* Contenedor de los controles */
.controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Botones y selects */
select, button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

select {
    background: #ffffff;
    color: #000000;
}

button {
    background: #ff4d4d;
    color: white;
}

button:hover {
    background: #e60000;
}

.iframe-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    padding-top: 56.25%;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 20px;
}

iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
}

#fondoIframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: url('https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/FONDO.png') no-repeat center center;
    background-size: cover;
    cursor: pointer;
    z-index: 2;
}

#volver-inicio {
    position: absolute;
    top: 10px;
    left: 10px;
    background-color: red;
    color: white;
    padding: 10px 15px;
    border-radius: 50px;
    border: none;
}

p {
    margin-top: 20px;
    text-align: center;
    line-height: 1.6;
}

/* Modo horizontal (pantallas anchas) */
@media (orientation: landscape) {
    .container {
        max-width: 800px;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
    }

    .controls {
        flex-direction: column;
        width: 40%;
    }

    .server-buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 50%;
    }

    .server-buttons button {
        flex: 1;
    }
}

/* Modo escritorio */
@media (min-width: 1024px) {
    .container {
        max-width: 900px;
        padding: 30px;
        border-radius: 20px;
    }

    .iframe-container {
        padding-top: 56.25%;  /* Mantener la relación de aspecto */
        max-width: 100%;
    }

    iframe {
        height: 100%;  /* Mantener el iframe a su altura natural */
    }
}
  </style> 
 </head> 
 <body> 
  <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';"> VOLVER AL INICIO </button> 
  <h1>Relatos Animados de la Biblia</h1> 
  <div class="container"> 
   <select id="temporadas"><option value="">Selecciona Temporada</option><option value="1">Temporada 1</option></select> 
   <select id="capitulos"><option value="">Selecciona Capítulo</option><option value="1">Capítulo 1</option><option value="2">Capítulo 2</option><option value="3">Capítulo 3</option><option value="4">Capítulo 4</option><option value="5">Capítulo 5</option><option value="6">Capítulo 6</option><option value="7">Capítulo 7</option><option value="8">Capítulo 8</option><option value="9">Capítulo 9</option><option value="10">Capítulo 10</option><option value="11">Capítulo 11</option><option value="12">Capítulo 12</option></select> 
   <button onclick="cargarCapitulo(1)">Ver en opción 1</button> 
   <button onclick="cargarCapitulo(2)">Ver en opción 2</button> 
  </div> 
  <div class="iframe-container"> 
   <div id="fondoIframe" onclick="ocultarFondo()" style="display: block;"></div> 
   <iframe id="secureFrame" allowfullscreen sandbox="allow-same-origin allow-scripts" allow="fullscreen; autoplay; encrypted-media" src="https://player.viloud.tv/embed/play?url=https://1a-1791.com/video/s8/2/Y/S/y/8/YSy8t.aaa.mp4"></iframe> 
  </div> 
  <p> La serie es una colección educativa no sectaria de historias de la Biblia hebrea, destinada a fomentar valores positivos y rasgos de carácter en los jóvenes.</p> 
  <script>
    const seriesData = {
      "1": {
        "capitulos": {
          "1": { "servidor1": "https://ok.ru/videoembed/3400190462537", "servidor2": "https://example.com/cap2-alt" },
          "2": { "servidor1": "https://ok.ru/videoembed/3400190200393", "servidor2": "https://example.com/cap2-alt" },
          "3": { "servidor1": "https://ok.ru/videoembed/3400190593609", "servidor2": "https://example.com/cap2-alt" },
          "4": { "servidor1": "https://ok.ru/videoembed/3400190069321", "servidor2": "https://example.com/cap2-alt" },
          "5": { "servidor1": "https://ok.ru/videoembed/3400190003785", "servidor2": "https://example.com/cap2-alt" },
          "6": { "servidor1": "https://ok.ru/videoembed/3400190265929", "servidor2": "https://example.com/cap2-alt" },
          "7": { "servidor1": "https://ok.ru/videoembed/3400189741641", "servidor2": "https://example.com/cap2-alt" },
          "8": { "servidor1": "https://ok.ru/videoembed/3400190397001", "servidor2": "https://example.com/cap2-alt" },
          "9": { "servidor1": "https://ok.ru/videoembed/3400190331465", "servidor2": "https://example.com/cap2-alt" },
          "10": { "servidor1": "https://ok.ru/videoembed/3400189872713", "servidor2": "https://example.com/cap2-alt" },
          "11": { "servidor1": "https://ok.ru/videoembed/3400190134857", "servidor2": "https://example.com/cap2-alt" },
          "12": { "servidor1": "https://ok.ru/videoembed/3400189938249", "servidor2": "https://example.com/cap2-alt" }


          
        }
      },


    };

    const temporadasSelect = document.getElementById("temporadas");
    const capitulosSelect = document.getElementById("capitulos");
    const iframe = document.getElementById("secureFrame");
    const fondoIframe = document.getElementById("fondoIframe");

    function cargarTemporadas() {
      temporadasSelect.innerHTML = "<option value=''>Selecciona Temporada</option>";
      Object.keys(seriesData).forEach(temp => {
        const option = document.createElement("option");
        option.value = temp;
        option.textContent = "Temporada " + temp;
        temporadasSelect.appendChild(option);
      });

      temporadasSelect.value = "1";
      cargarCapitulos();
    }

    function cargarCapitulos() {
      const temporadaSeleccionada = temporadasSelect.value;
      capitulosSelect.innerHTML = "<option value=''>Selecciona Capítulo</option>";

      if (temporadaSeleccionada && seriesData[temporadaSeleccionada]) {
        Object.keys(seriesData[temporadaSeleccionada].capitulos).forEach(cap => {
          const option = document.createElement("option");
          option.value = cap;
          option.textContent = "Capítulo " + cap;
          capitulosSelect.appendChild(option);
        });

        capitulosSelect.value = "1";
        cargarCapitulo(1);
      }
    }

    function cargarCapitulo(servidor) {
      const temporadaSeleccionada = temporadasSelect.value;
      const capituloSeleccionado = capitulosSelect.value;

      if (temporadaSeleccionada && capituloSeleccionado) {
        const capituloData = seriesData[temporadaSeleccionada].capitulos[capituloSeleccionado];

        if (capituloData) {
          iframe.src = capituloData[`servidor${servidor}`];
          mostrarIframe();
        }
      } else {
        alert("Seleccione una temporada y un capítulo.");
      }
    }

    capitulosSelect.addEventListener("change", () => {
      cargarCapitulo(1);
    });

    function ocultarFondo() {
      fondoIframe.style.display = "none";
    }

    function mostrarIframe() {
      fondoIframe.style.display = "block";
    }

    window.addEventListener("load", cargarTemporadas);
</script> 
 </body>
</html>
