<html lang="es">
<head>

  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">

<body>
          <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';">
    VOLVER AL INICIO
</button>

<div style="height: 50px;"></div>
  <!-- Título -->
  <h1>Escuadrón 6</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://1a-1791.com/video/fwe2/d9/s8/2/L/x/G/W/LxGWx.aaa.mp4')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://vidhidefast.com/v/n57vkuz9wvd3')">Opción 2</button>
    <button class="button" onclick="loadIframe('https://vidhidefast.com/v/ow3clhiuoa8v')">Opción 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <div class="overlay" onclick="hideOverlay()"></div>
    <iframe id="secureFrame" src="https://1a-1791.com/video/fwe2/d9/s8/2/L/x/G/W/LxGWx.aaa.mp4" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>

    <button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>

  <!-- Texto adicional debajo del iframe -->
  <p>
    Un multimillonario genio de la tecnología simula su muerte y conforma un equipo internacional para derrocar a un cruel dictador en una misión arriesgada y sangrienta.
  </p>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://1a-1791.com/video/fwe2/d9/s8/2/L/x/G/W/LxGWx.aaa.mp4", 
      "https://vidhidefast.com/v/n57vkuz9wvd3", 
      "https://vidhidefast.com/v/ow3clhiuoa8v"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://1a-1791.com/video/fwe2/d9/s8/2/L/x/G/W/LxGWx.aaa.mp4";
    });

     function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script>
  
</body>
</html>
