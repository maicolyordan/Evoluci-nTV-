 <body>

  <div style="height: 50px;"></div> 
  <!-- Título --> 
  <h1>Robin Hood 2010
</h1> 
  <!-- Contenedor de botones --> 
  <div class="buttons-container"> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/7727570291247')">Opción 1</button> 
   <button class="button" onclick="loadIframe('https://vidhidefast.com/v/tnz384y0f677')">Opción 2</button> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/8200333757110y')">Opción 3</button> 
  </div> 
  <!-- Contenedor del iframe --> 
  <div class="iframe-container"> 
   <div class="overlay" onclick="hideOverlay()"></div> 
   <iframe id="secureFrame" src="https://ok.ru/videoembed/7727570291247" allowfullscreen sandbox="allow-same-origin allow-scripts" allow="fullscreen; autoplay; encrypted-media"> </iframe> 
  </div> 

    <button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>
  <!-- Texto adicional debajo del iframe --> 
  <p> Cuando el soldado Robin se encuentra con el moribundo Robert de Loxley, promete devolver la espada del hombre a su familia en Nottingham. Allí, él asume la identidad de Robert; romances a su viuda, Marion; y atrae la ira del sheriff de la ciudad y el esbirro del rey Juan, Godfrey.</p> 
  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/7727570291247", 
      "https://vidhidefast.com/v/tnz384y0f677", 
      "https://ok.ru/videoembed/8200333757110y"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/7727570291247";
    });


     function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script> 
 </body>
