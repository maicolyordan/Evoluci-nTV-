      <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">

<body>
          <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';">
    VOLVER AL INICIO
</button>

<div style="height: 50px;"></div>
  <!-- Título -->
  <h1>Fuera de las sombras 2024</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://player.viloud.tv/embed/play?url=https://1a-1791.com/video/fww1/31/s8/2/G/7/r/t/G7rty.aaa.mp4')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://niikaplayerr.com/v/06et00zynjqr')">Opción 2</button>
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/356972235395h')">Opción 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <div class="overlay" onclick="hideOverlay()"></div>
    <iframe id="secureFrame" src="https://player.viloud.tv/embed/play?url=https://1a-1791.com/video/fww1/31/s8/2/G/7/r/t/G7rty.aaa.mp4" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>
<button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>

  <!-- Texto adicional debajo del iframe -->
  <p>
    Una joven sicaria, experta en el arte de matar, desafía a su mentora para salvar a un niño de una organización criminal… sin tener piedad de quien se cruce en su camino.
  </p>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://player.viloud.tv/embed/play?url=https://1a-1791.com/video/fww1/31/s8/2/G/7/r/t/G7rty.aaa.mp4", 
      "https://niikaplayerr.com/v/06et00zynjqr", 
      "https://ok.ru/videoembed/356972235395h"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://player.viloud.tv/embed/play?url=https://1a-1791.com/video/fww1/31/s8/2/G/7/r/t/G7rty.aaa.mp4";
    });

        function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script>
  
</body>
</html>
