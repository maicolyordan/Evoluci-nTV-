  <html lang="es">
 <head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Proyecto Extraccion 2023</title> 
  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
 <body> 
  <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';"> VOLVER AL INICIO </button> 
  <div style="height: 50px;"></div> 
  <!-- Título --> 
  <h1>Proyecto Extracción 2023
</h1> 
  <!-- Contenedor de botones --> 
  <div class="buttons-container"> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/11202524875335')">Opción 1</button> 
   <button class="button" onclick="loadIframe('https://niikaplayerr.com/v/zjoxpueirsw2')">Opción 2</button> 
   <button class="button" onclick="loadIframe('https://ok.ru/videoembed/8200333757110y')">Opción 3</button> 
  </div> 
  <!-- Contenedor del iframe --> 
  <div class="iframe-container"> 
   <div class="overlay" onclick="hideOverlay()"></div> 
   <iframe id="secureFrame" src="https://ok.ru/videoembed/11202524875335" allowfullscreen sandbox="allow-same-origin allow-scripts" allow="fullscreen; autoplay; encrypted-media"> </iframe> 
  </div> 
<button class="fullscreen-button" onclick="goFullScreen()">Pantalla completa</button>
   
  <!-- Texto adicional debajo del iframe --> 
  <p> Dos veteranos de guerra son asignados con la misión de escoltar a un grupo de civiles en la denominada "autopista de la muerte", en Baghdad, para que lleguen sanos y salvos a la "Zona Verde", el emplazamiento de seguridad de la zona.</p> 
  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/11202524875335", 
      "https://niikaplayerr.com/v/zjoxpueirsw2", 
      "https://ok.ru/videoembed/8200333757110y"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/11202524875335";
    });

    function goFullScreen() {
  const iframe = document.querySelector("iframe"); // selecciona el primer iframe del documento
  if (iframe) {
    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    } else if (iframe.webkitRequestFullscreen) {
      iframe.webkitRequestFullscreen();
    } else if (iframe.mozRequestFullScreen) {
      iframe.mozRequestFullScreen();
    } else if (iframe.msRequestFullscreen) {
      iframe.msRequestFullscreen();
    }
  } else {
    console.warn("No se encontró ningún iframe.");
  }
}
  </script> 
 </body>
</html>
