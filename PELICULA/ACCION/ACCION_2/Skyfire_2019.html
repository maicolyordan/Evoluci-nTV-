  <p> En una isla volcánica se construye un centro vacacional con espectaculares atracciones. Pese al aviso de sismólogos de actividad volcánica, su dueño seguirá adelante con los planes, abriendo el parque de atracciones a inversores y sus familias. </p> 
  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/7368125385263", 
      "https://ryderjet.com/embed/t54en2ptjdpq", 
      "https://ok.ru/videoembed/736812538h5263"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/7368125385263";
    });
  </script>
