     <!DOCTYPE html>
<html lang="es">
<head>

<head>

<body>
          <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';">
    VOLVER AL INICIO
</button>

<div style="height: 50px;"></div>
  <!-- Título -->
  <h1>Son como niños 2</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://archive.org/embed/son-como-ninos-2_202107/Son%20como%20ni%C3%B1os%202.mp4')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/592166128325')">Opción 2</button>
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/356972235395')">Opción 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <div class="overlay" onclick="hideOverlay()"></div>
    <iframe id="secureFrame" src="https://archive.org/embed/son-como-ninos-2_202107/Son%20como%20ni%C3%B1os%202.mp4" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- Texto adicional debajo del iframe -->
  <p>
    Lenny se ha trasladado con su familia a la pequeña ciudad donde tanto él como sus amigos se criaron. En esta ocasión, los adultos serán quienes reciban toda una lección de sus propios hijos. Secuela de "Niños grandes
  </p>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://archive.org/embed/son-como-ninos-2_202107/Son%20como%20ni%C3%B1os%202.mp4", 
      "https://ok.ru/videoembed/592166128325", 
      "https://ok.ru/videoembed/356972235395"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://archive.org/embed/son-como-ninos-2_202107/Son%20como%20ni%C3%B1os%202.mp4";
    });
  </script>
  
</body>
</html>
