     <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Ladrón a Policía</title>
  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
<body>
          <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';">
    VOLVER AL INICIO
</button>

<div style="height: 50px;"></div>
  <!-- Título -->
  <h1>De Ladrón a Policía</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://archive.org/embed/de-ladron-a-policia')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://vidhidefast.com/v/uerwtkqh4upz')">Opción 2</button>
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/2842405243527')">Opción 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <div class="overlay" onclick="hideOverlay()"></div>
    <iframe id="secureFrame" src="https://archive.org/embed/de-ladron-a-policia" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- Texto adicional debajo del iframe -->
  <p>
    Un ladrón en libertad condicional se hace pasar por policía para recuperar un diamante que escondió en una estación policíaca.
  </p>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://archive.org/embed/de-ladron-a-policia", 
      "https://vidhidefast.com/v/uerwtkqh4upz", 
      "https://ok.ru/videoembed/2842405243527"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://archive.org/embed/de-ladron-a-policia";
    });
  </script>
  
</body>
</html>
