     <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacaciones 2015</title>
  <head>
  <link rel="stylesheet" href="https://maicolyordan.github.io/Evoluci-nTV-/ESTYLO/pelicula.css">
</head>
<body>
          <button id="volver-inicio" onclick="window.location.href='https://maicolyordan.github.io/Evoluci-nTV-/IMAGEN/Directoinicio.html';">
    VOLVER AL INICIO
</button>

<div style="height: 50px;"></div>
  <!-- Título -->
  <h1>Vacaciones (2015)</h1>

  <!-- Contenedor de botones -->
  <div class="buttons-container">
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/356975577731')">Opción 1</button>
    <button class="button" onclick="loadIframe('https://ok.ru/videoembed/7816624146991')">Opción 2</button>
    <button class="button" onclick="loadIframe('https://vidhidefast.com/v/o9owpe8civco')">Opción 3</button>
  </div>

  <!-- Contenedor del iframe -->
  <div class="iframe-container">
    <div class="overlay" onclick="hideOverlay()"></div>
    <iframe id="secureFrame" src="https://ok.ru/videoembed/356975577731" 
      allowfullscreen sandbox="allow-same-origin allow-scripts" 
      allow="fullscreen; autoplay; encrypted-media">
    </iframe>
  </div>

  <!-- Texto adicional debajo del iframe -->
  <p>
    Con la esperanza de reconstruir los vínculos familiares, Rusty Griswold decide dar una sorpresa a su mujer y a sus dos hijos, proponiéndoles viajar a través del país hasta llegar al “parque de atracciones favorito de las familias estadounidenses”, Walley World.
  </p>

  <script>
    // Lista de URLs permitidas
    const allowedURLs = [
      "https://ok.ru/videoembed/356975577731", 
      "https://ok.ru/videoembed/7816624146991", 
      "https://vidhidefast.com/v/o9owpe8civco"
    ];
    
    const iframe = document.getElementById('secureFrame');
    const overlay = document.querySelector('.overlay');

    // Función para cargar la URL en el iframe
    function loadIframe(url) {
      if (allowedURLs.includes(url)) {
        iframe.src = url;
      } else {
        iframe.src = "about:blank"; // Redirige a una página completamente en blanco
      }
    }

    // Función para ocultar la imagen de superposición
    function hideOverlay() {
      overlay.style.display = 'none';
    }

    // Asegurar que la URL inicial sea predeterminada
    window.addEventListener('load', () => {
      iframe.src = "https://ok.ru/videoembed/356975577731";
    });
  </script>
  
</body>
</html>
