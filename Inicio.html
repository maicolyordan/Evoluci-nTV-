}

        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #009bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .chat-button:hover {
            background-color: #009bff;
            transform: scale(1.1);
        }

        .chat-button:active {
            transform: scale(0.9);
        }

        /* Contenedor del chat */
        .chat-container {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 300px;
            height: 540px;
            background-color: white;
            border-radius: 10px;

            flex-direction: column;
            overflow: hidden;

        .chat-header {

            color: white;
            padding: 10px;

            font-weight: bold;

video {

button {

            color: white;

    <script>
        function buscar() {
            var busqueda = document.getElementById('busqueda').value;
            if (busqueda) {
                // Redirige a la página de búsqueda con el término ingresado como parámetro
                window.location.href = "https://maicolyordan.github.io/Evoluci-nTV-/BUSQUEDA.html?q=" + encodeURIComponent(busqueda);
            } else {
                // Si el campo está vacío, redirige igualmente con un parámetro vacío
                window.location.href = "https://maicolyordan.github.io/Evoluci-nTV-/BUSQUEDA.html?q=";
            }
        }

        function redirigir(url) {
            // Redirige a la URL especificada
            window.location.href = url;
        }
        
  
 
function toggleChat() {
            var chatContainer = document.getElementById("chatContainer");
            if (chatContainer.style.display === "none" || chatContainer.style.display === "") {
                chatContainer.style.display = "flex";
            } else {
                chatContainer.style.display = "none";
            }
        }
        
var videos = [
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/A%20prueba%20de%20Fuego.mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/CRISTIANA/a_prueba_de_fuego.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/LA%20GUERRA%20DEL%20MA%C3%91ANA.mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/la_guerra_del_ma%C3%B1ana.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/MI%20VILLANO%20FAVORITO.mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/ANIMADO/mi_villano_favorito_4.html" },
            { url: "https://github.com/maicolyordan/Evoluci-nTV-/raw/refs/heads/Html/TRAILER/Nacho%20Libre.mp4", page: "https://maicolyordan.github.io/Evoluci-nTV-/PELICULA/COMEDIA/nacho_libre.html" }
            
        ];

        var currentVideoIndex = -1;

        function playRandomVideo() {
            var newIndex;
            do {
                newIndex = Math.floor(Math.random() * videos.length);
            } while (newIndex === currentVideoIndex); // Evita repetir el mismo video

            currentVideoIndex = newIndex;
            var selectedVideo = videos[currentVideoIndex];

            var video = document.getElementById('liveVideo');
            var button = document.getElementById('redirectButton');

            video.src = selectedVideo.url;
            button.onclick = function() {
                window.location.href = selectedVideo.page;
            };

            video.play();
        }

        document.addEventListener("fullscreenchange", function() {
            if (document.fullscreenElement) {
                window.location.href = videos[currentVideoIndex].page;
            }
        });

        window.onload = function() {
            playRandomVideo();

            var video = document.getElementById('liveVideo');
            video.onended = function() { 
                playRandomVideo(); // Cambia al siguiente video al terminar
            };
        };
    </script>
