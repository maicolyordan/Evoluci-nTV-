        body {
            margin: 0;

        h1 {
            color: #fff;
            font-size: 28px;
            margin: 20px 0;
            text-align: center;
        }

        .header {
            text-align: center;
            padding: 10px;
            background-color: #0d0b25;
            font-size: 16px;
            color: #33aaff;
        }

        .search-container {
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .search-box {
            background-color: #ffffff;
            padding: 2px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 150px;
        }


        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
        }

        .nav a {
            color: white;
            text-decoration: none;
        }

        .content {
            padding: 20px;
            position: relative; /* Para posicionar los botones en relación con la lista */
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            border-left: 3px solid red;
            padding-left: 5px;
        }

        .movie-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .movie-list {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .movie-list img {
            width: 100px;
            border-radius: 5px;
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: red;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
        }

        .arrow-left {
            left: -1px;
        }

        .arrow-right {
            right: -1px;
        }

        @media (orientation: landscape) {
            .search-box input {
                width: 250px;
            }
            
            .movie-list img {
                width: 200px;
            }
        }
        
        
        
.search-box button {
    background: red;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s ease background, 0.2s ease transform;
}

.search-box button:hover {
    background: darkred;
    transform: scale(1.05);
}

.search-box button:active {
    background: #a00000;
    transform: scale(0.95);
}


/* Asegurar que todos los elementos puedan ser enfocados */
* {
  outline: none; /* Elimina el borde por defecto del navegador */
}

/* Estilo general para resaltar el enfoque */
button:focus, a:focus, div:focus, input:focus, textarea:focus, img:focus {
  outline: 3px solid red; /* Borde brillante de color rojo para resaltar el enfoque */
  background-color: #555; /* Fondo ligeramente cambiado cuando está enfocado */
  transform: scale(1.05); /* Agranda el elemento ligeramente */
  transition: background-color 0.3s, transform 0.3s; /* Transiciones suaves */
}

/* Para enlaces o elementos interactivos que se ven bien sin que el fondo cambie */
a:focus {
  color: red; /* Cambia el color del texto del enlace cuando está enfocado */
}

/* Opcional: para imágenes o elementos que quieras resaltar sin cambiar su color de fondo */
img:focus {
  border: 3px solid red; /* Agrega un borde resaltado de color rojo a las imágenes */
  transform: scale(1.1); /* Agranda la imagen ligeramente */
}

/* Si el elemento no tiene un fondo visible, puedes aplicar un enfoque solo con el borde */
div:focus {
  border: 2px dashed red; /* Aplica un borde de puntos rojos en los divs */
}
