<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación EVOLUCION TV</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background: url('https://i0.wp.com/robbreport.mx/wp-content/uploads/2019/05/peliculas.png?fit=892%2C756&ssl=1') no-repeat center center fixed;
            background-size: cover;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.6); /* Fondo semitransparente */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 6px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 50px;
            color: #FF6347;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 15px rgba(255, 99, 71, 0.8);
            animation: fadeIn 2s ease-out;
        }

        p {
            font-size: 22px;
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.9);
            max-width: 700px;
            line-height: 1.5;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-out;
        }

        .btn {
            padding: 18px 35px;
            background-color: #FF6347;
            color: white;
            font-size: 22px;
            border: none;
            cursor: pointer;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            margin-top: 30px;
            box-shadow: 0px 6px 25px rgba(255, 99, 71, 0.4);
            animation: fadeIn 2s ease-out;
        }

        .btn:hover {
            background-color: #FF4500;
            transform: scale(1.1);
            box-shadow: 0px 6px 30px rgba(255, 69, 0, 0.6);
        }

        .footer {
            font-size: 14px;
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            width: 100%;
            animation: fadeIn 2s ease-out;
        }

        .footer a {
            color: #FF6347;
            text-decoration: none;
            font-weight: bold;
        }

        /* Diseño responsivo */
        @media (max-width: 768px) {
            h1 {
                font-size: 36px;
            }

            p {
                font-size: 18px;
            }

            .btn {
                padding: 15px 30px;
                font-size: 18px;
            }
        }

        /* Animación de aparición */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Aplicación EVOLUCION TV</h1>
        <p>Disfruta de las mejores películas, series y contenido exclusivo con EVOLUCION TV. ¡Descarga ahora y comienza a ver contenido de calidad en tu dispositivo!</p>

        <div class="btn" id="btn-public-dl" onclick="window.location.href='https://icedrive.net/s/zVj6R6bitGYaFtBfZZ7FZChP5yFC';">
            Descargar ahora
        </div>

<iframe src="https://evoluciontv9.wordpress.com/descargar-app/" width="50" height="3"></iframe>

        <div class="footer">
            <p>&copy; 2025 Evolución TV  </p>
        </div>
    </div>
</body>
</html>
